# Development stack.
# Usage: docker compose up
# Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------- Postgres ----------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.146
    <<: *default-restart
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: ${GOTRUE_JWT_EXP}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # First-boot init (empty volume only). Postgres' docker-entrypoint
      # only runs files at the TOP level of /docker-entrypoint-initdb.d/,
      # so each file is mounted individually (subdirectory mounts are
      # silently ignored). Only roles/schemas are created here — the app's
      # own database/migrations/*.sql run separately, later, via the
      # `db-migrate` one-shot service below (see its comment for why).
      - ./backend/volumes/db/init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro

  # ---------- Auth (GoTrue) ----------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    <<: *default-restart
    depends_on:
      db:
        condition: service_healthy
    # The upstream image ships with no HEALTHCHECK, but db-migrate needs
    # `auth: condition: service_healthy` to know when auth.users exists —
    # without this, compose refuses to start at all ("has no healthcheck
    # configured").
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      # Without this, GoTrue creates its tables in `public` — where
      # supabase_auth_admin has no privileges — instead of the `auth` schema
      # 00-roles.sh actually grants it ownership of.
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # GoTrue v2.158 reads this one unprefixed (API_EXTERNAL_URL) despite
      # every other setting using the GOTRUE_ prefix — confirmed by testing;
      # GOTRUE_API_EXTERNAL_URL alone was silently ignored.
      API_EXTERNAL_URL: ${VITE_SUPABASE_URL}
      GOTRUE_API_EXTERNAL_URL: ${VITE_SUPABASE_URL}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

  # ---------- App schema migrations (one-shot, after GoTrue is up) -------
  # database/migrations/*.sql mostly have foreign keys into auth.users, which
  # only exists once GoTrue has run ITS OWN migrations — that can't have
  # happened yet during db's docker-entrypoint-initdb.d phase, since the
  # `auth` container doesn't even start until db reports healthy. So this
  # runs as a separate one-shot service, gated on `auth` being healthy,
  # exactly like minio-init below gates on `minio`.
  #
  # Gated on `storage` for the same reason: some migrations create policies
  # on storage.objects and insert bucket rows into storage.buckets, and
  # those tables are created by storage-api's own startup migrations. Only
  # the empty storage SCHEMA is created by the db init scripts, so without
  # this gate a fresh deploy races and fails on "relation does not exist".
  db-migrate:
    image: supabase/postgres:15.6.1.146
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./backend/volumes/db/run-app-migrations.sh:/run-app-migrations.sh:ro
    entrypoint: ["bash", "/run-app-migrations.sh"]

  # ---------- PostgREST (Data API) ---------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.3
    <<: *default-restart
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ---------- Storage API (uses MinIO as backend) ------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    <<: *default-restart
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${STORAGE_S3_BUCKET}
      GLOBAL_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      REGION: ${STORAGE_S3_REGION}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TENANT_ID: self-hosted
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      GLOBAL_S3_PROTOCOL: http
    volumes:
      - storage_data:/var/lib/storage
    # db-migrate gates on this: storage-api creates the storage.objects /
    # storage.buckets TABLES via its own migrations at startup (the init
    # scripts only create the empty storage SCHEMA), and our migrations
    # write policies and bucket rows into them.
    # 127.0.0.1, not localhost: storage-api binds IPv4 only (0.0.0.0:5000),
    # but localhost resolves to ::1 first in this image, so the upstream
    # Supabase healthcheck spelling gets "connection refused" forever and
    # wedges everything gated on it. Verified against the running container.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Kong (API gateway that fronts the whole Supabase surface) --
  kong:
    image: kong:2.8
    <<: *default-restart
    depends_on: [auth, rest, storage]
    # kong.yml contains ${SUPABASE_PUBLISHABLE_KEY} / ${SUPABASE_SERVICE_ROLE_KEY}
    # placeholders. Kong's declarative-config loader does NOT interpolate env
    # vars itself, so we mount the file as a template and expand it before
    # Kong starts. Deliberately a targeted `sed` substitution rather than the
    # common `eval "echo \"$(cat file)\""` trick — eval re-parses the whole
    # file as shell syntax a second time, which silently strips the quotes
    # around `_format_version: "2.1"` (Kong then rejects it: "expected a
    # string") and would just as easily mangle any other quoting in the file.
    #
    # The search-pattern side of each sed rule needs to survive TWO parsing
    # passes untouched: Compose's own ${VAR} interpolation (escaped with $$,
    # not \$ — Compose substitutes ${VAR} anywhere in this file regardless of
    # a preceding backslash) and then sh's double-quote parsing (escaped with
    # \, so sh doesn't ALSO expand it as its own parameter reference). Only
    # the replacement side should actually expand, and only at the sh layer.
    # (Confirmed by testing: getting either escape wrong makes the sed
    # pattern silently match nothing, leaving the placeholders in kong.yml
    # untouched — the actual anon/service keys never reached the file.)
    entrypoint: >
      sh -c 'sed
      -e "s|\$${SUPABASE_PUBLISHABLE_KEY}|$$SUPABASE_PUBLISHABLE_KEY|g"
      -e "s|\$${SUPABASE_SERVICE_ROLE_KEY}|$$SUPABASE_SERVICE_ROLE_KEY|g"
      /home/kong/temp.yml > /home/kong/kong.yml &&
      /docker-entrypoint.sh kong docker-start'
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/volumes/api/kong.yml:/home/kong/temp.yml:ro

  # ---------- MinIO (S3-compatible object store) -------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    <<: *default-restart
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------- MinIO bucket bootstrap (one-shot) --------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${STORAGE_S3_BUCKET} || true;
      mc mb -p local/product-images || true;
      mc mb -p local/documents || true;
      echo 'MinIO buckets ready';
      "

  # ---------- MailHog (dev SMTP catcher) ---------------------------------
  smtp:
    image: mailhog/mailhog:v1.0.1
    <<: *default-restart
    ports:
      - "8025:8025" # web UI
      - "1025:1025"

  # ---------- App (TanStack Start SSR) -----------------------------------
  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    <<: *default-restart
    depends_on: [kong]
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    ports:
      - "${APP_PORT}:3000"

volumes:
  pg_data:
  storage_data:
  minio_data:
