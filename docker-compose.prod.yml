# Production overrides. Applied on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences vs dev:
#  - restart: always on every service
#  - No bind-mount of source, no exposed DB/MinIO ports to the host
#  - Nginx reverse-proxy + certbot for TLS
#  - MailHog replaced by real SMTP (env-driven)
#  - Resource limits + logging caps

x-restart: &prod-restart
  restart: always

x-logging: &prod-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: [*prod-restart, *prod-logging]
    # Compose merges list fields like `ports` across -f files by
    # concatenation, not replacement — a plain `ports: []` here has nothing
    # to add and silently leaves the base file's published port intact.
    # `!reset` is the compose-spec's explicit tag for "replace, don't merge"
    # and is what's actually needed to drop the port in prod. Confirmed via
    # a real production exposure: db (5432) and app (8080) stayed published
    # to the internet with plain `ports: []` despite this file's intent.
    ports: !reset []

  auth:
    <<: [*prod-restart, *prod-logging]

  rest:
    <<: [*prod-restart, *prod-logging]

  storage:
    <<: [*prod-restart, *prod-logging]

  kong:
    <<: [*prod-restart, *prod-logging]
    # Compose merges list fields like `ports` across -f files by
    # concatenation, not replacement — a plain `ports: []` here has nothing
    # to add and silently leaves the base file's published port intact.
    # `!reset` is the compose-spec's explicit tag for "replace, don't merge"
    # and is what's actually needed to drop the port in prod. Confirmed via
    # a real production exposure: db (5432) and app (8080) stayed published
    # to the internet with plain `ports: []` despite this file's intent.
    ports: !reset []

  minio:
    <<: [*prod-restart, *prod-logging]
    # Compose merges list fields like `ports` across -f files by
    # concatenation, not replacement — a plain `ports: []` here has nothing
    # to add and silently leaves the base file's published port intact.
    # `!reset` is the compose-spec's explicit tag for "replace, don't merge"
    # and is what's actually needed to drop the port in prod. Confirmed via
    # a real production exposure: db (5432) and app (8080) stayed published
    # to the internet with plain `ports: []` despite this file's intent.
    ports: !reset []

  # No dev SMTP in prod
  smtp:
    profiles: ["never"]

  app:
    <<: [*prod-restart, *prod-logging]
    # Compose merges list fields like `ports` across -f files by
    # concatenation, not replacement — a plain `ports: []` here has nothing
    # to add and silently leaves the base file's published port intact.
    # `!reset` is the compose-spec's explicit tag for "replace, don't merge"
    # and is what's actually needed to drop the port in prod. Confirmed via
    # a real production exposure: db (5432) and app (8080) stayed published
    # to the internet with plain `ports: []` despite this file's intent.
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:1.27-alpine
    <<: [*prod-restart, *prod-logging]
    depends_on: [app, kong]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
      # Bind-mounted (not a named volume) so it's readable from the host
      # filesystem directly — scripts/harden-host.sh's fail2ban jail tails
      # this to catch repeated 429s. Must exist and be writable by nginx's
      # worker process before first start; scripts/init-letsencrypt.sh and
      # scripts/harden-host.sh both ensure that.
      - ./nginx/logs:/var/log/nginx-shared
    environment:
      DOMAIN_APP: ${DOMAIN_APP}
      DOMAIN_SUPABASE: ${DOMAIN_SUPABASE}

  certbot:
    image: certbot/certbot:v2.11.0
    <<: *prod-logging
    depends_on: [nginx]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  letsencrypt:
  letsencrypt_www:
