# App + Supabase reverse proxy. Replace $DOMAIN_APP / $DOMAIN_SUPABASE with
# your real domains before starting the prod stack — nginx does NOT interpolate
# env vars at runtime by default; edit these two files or run the generator
# in scripts/render-nginx.sh (see MIGRATION.md § VPS deployment).

# --- ACME HTTP-01 challenge (Let's Encrypt) -----------------------------
server {
  listen 80;
  server_name app.example.com supabase.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

# --- App ----------------------------------------------------------------
server {
  listen 443 ssl http2;
  server_name app.example.com;

  ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://app:3000;
  }
}

# --- Supabase API gateway (Kong) ---------------------------------------
server {
  listen 443 ssl http2;
  server_name supabase.example.com;

  ssl_certificate     /etc/letsencrypt/live/supabase.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/supabase.example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://kong:8000;
  }
}
