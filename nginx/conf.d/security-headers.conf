# Baseline security headers, applied globally.
#
# This file is picked up automatically by nginx.conf's `include
# /etc/nginx/conf.d/*.conf;` at the http{} level, so every server block
# inherits these by default. IMPORTANT nginx gotcha: `add_header` does NOT
# merge across nesting levels — a server{} block that defines its own
# add_header directives (like app.conf.template's CSP) REPLACES this entire
# list for that block, not adds to it. That's why app.conf.template repeats
# all of these headers alongside its domain-specific CSP instead of relying
# on inheritance.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
