user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # The official nginx image symlinks its default access/error logs to
  # /dev/stdout /dev/stderr so `docker logs` picks them up — fine for normal
  # viewing, but fail2ban runs on the host, outside Docker, and can't tail
  # container stdout. This second, real log file is bind-mounted to the host
  # (see docker-compose.prod.yml) specifically so scripts/harden-host.sh's
  # fail2ban jail can watch it for repeated 429s.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  access_log /var/log/nginx-shared/access.log main;
  sendfile      on;
  keepalive_timeout 65;
  # Matches Storage's FILE_SIZE_LIMIT (52428800 bytes = 50MB) plus headroom
  # for multipart/form-data boundary overhead.
  client_max_body_size 55M;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Rate-limit zones (protect auth/token endpoints from brute-force).
  # 10 MB stores ~160k IPs. Auth: 5 r/s burst 10. General API: 30 r/s burst 60.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
  limit_req_status 429;

  # Docker's embedded DNS. Required because every proxy_pass below targets a
  # compose service by name THROUGH A VARIABLE — see the comment on
  # `set $upstream_app` in conf.d/app.conf.template.
  #
  # Without a resolver, nginx resolves each proxy_pass hostname exactly once,
  # at config load, and caches that IP for the lifetime of the worker. On
  # 2026-09-08 a container recreation reshuffled Docker's IPs; nginx (up 11
  # days, never restarted) kept proxying to the address it had memorised,
  # which by then belonged to PostgREST. The site returned HTTP 200 serving
  # PostgREST's OpenAPI JSON for 15 minutes. `valid=30s` bounds how long a
  # stale record can survive.
  #
  # ipv6=off because Docker's resolver answers AAAA for these names on some
  # engine versions and nginx then tries the v6 address first against
  # containers that only listen on v4.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Basic reverse-proxy defaults
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        "upgrade";

  include /etc/nginx/conf.d/*.conf;
}
