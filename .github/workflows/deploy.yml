# CI/CD: on push to main, SSH into the prod VPS and redeploy.
#
# Required GitHub repository secrets:
#   SSH_HOST         e.g. app.example.com
#   SSH_USER         e.g. deploy
#   SSH_KEY          contents of a private key whose public key is in ~deploy/.ssh/authorized_keys
#   SSH_PORT         optional, defaults to 22
#   DEPLOY_PATH      absolute path on the VPS, e.g. /opt/nolte
#
# The VPS must already have Docker + Compose installed and the repo cloned at DEPLOY_PATH,
# with a valid .env produced by scripts/bootstrap.sh.

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, migrate, rebuild
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "set -euo pipefail; \
               cd '${{ secrets.DEPLOY_PATH }}'; \
               PREV=\$(git rev-parse HEAD); \
               git fetch origin; \
               git checkout main; \
               git reset --hard origin/main; \
               docker compose -f docker-compose.yml -f docker-compose.prod.yml build app; \
               ./scripts/migrate.sh; \
               docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app; \
               if git diff --name-only \$PREV HEAD | grep -q '^nginx/'; then \
                 echo '[deploy] config nginx modifiee -> rendu + redemarrage'; \
                 ./scripts/render-nginx.sh; \
                 docker compose -f docker-compose.yml -f docker-compose.prod.yml restart nginx; \
               fi; \
               docker image prune -f"
